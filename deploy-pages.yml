name: Deploy frontend to GitHub Pages

# Runs on every push to main. GitHub Pages needs to be told exactly which
# folder to publish — by default it looks for index.html at the repo root,
# but ours lives at crop-disease-detection/frontend/public/index.html, which
# is why shashuworries.github.io/CROPCAREAI/ was timing out: there was
# nothing configured to serve from that path.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}   # lets you manually re-run this from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the frontend/public folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crop-disease-detection/frontend/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
